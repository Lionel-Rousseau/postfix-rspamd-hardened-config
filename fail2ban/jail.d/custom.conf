# =============================================================================
# /etc/fail2ban/jail.d/custom.conf : site-specific jail configuration
#
# Overrides and additions on top of the Debian default jail.conf.
# Anonymised: real IPs replaced with RFC 5737 / RFC 3849 documentation ranges.
# =============================================================================

[DEFAULT]
# Trusted hosts never banned regardless of log activity.
# Add all server IPs, admin workstations, and known partner ranges here.
ignoreip = 127.0.0.1/8, [::1]/128,
    203.0.113.10,            # primary MX
    203.0.113.0/24,          # primary datacenter subnet
    2001:db8:0:1::,          # primary datacenter IPv6
    198.51.100.67,           # secondary MX
    198.51.100.0/24,         # secondary datacenter subnet
    2001:db8:0:2::1,         # secondary MX IPv6
    192.0.2.1,               # trusted admin host
    192.0.2.0/24,            # trusted client subnet
    2001:db8:cafe::/64,      # trusted operator IPv6 range
    # Cloudflare health-check IPs : add full list from https://www.cloudflare.com/ips/
    104.16.0.0/12

banaction = iptables-allports[blocktype=DROP]
findtime  = 10800
bantime   = 2630000
maxretry  = 3
allowipv6 = auto
logencoding = auto


# =============================================================================
# SSH
# =============================================================================

[sshd]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
mode      = aggressive
filter    = sshd[mode=aggressive,publickey=invalid]
# Non-standard SSH port (22 kept as fallback during transition)
port      = 1622,22
logpath   = %(sshd_log)s
backend   = systemd


# =============================================================================
# POSTFIX
# =============================================================================

[postfix]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
filter    = postfix[mode=extra]
findtime  = 10800
bantime   = 864000
maxretry  = 3
logpath   = /var/log/mail.log

[postfix-flood-attack]
enabled  = true
bantime  = 7890000
maxretry = 3
filter   = postfix-flood-attack
# Ban all mail-related ports on flood detection
action   = iptables-multiport[name=postfix, port="http,https,smtp,submission,pop3,pop3s,imap,imaps,sieve", protocol=tcp, blocktype=DROP]
logpath  = /var/log/mail.log

[postfix-sasl]
enabled  = true
filter   = postfix-sasl
action   = iptables-allports[blocktype=DROP]
           mail[name="Postfix SASL"]
bantime  = 7890000
port     = smtp,465,submission,imap,imap3,imaps,pop3,pop3s
maxretry = 3
logpath  = /var/log/mail.log

# postscreen-aggr: bans IPs triggering PREGREET or HANGUP events in postscreen.
# Progressive schedule: 2h → 24h → 7d → 60d → max 180d.
[postscreen-aggr]
enabled  = true
filter   = postscreen-aggr
logpath  = /var/log/mail.log
backend  = auto
maxretry = 4
findtime = 45m
bantime  = 2h
bantime.increment    = true
bantime.multipliers  = 1 12 84 720
bantime.maxtime      = 180d
# Short action name to avoid iptables chain-name length limit
banaction = iptables-multiport[name=psaggr, port="25", protocol=tcp]

# postfix-subnet: when postfix-sasl bans an IP, also ban its /24 subnet.
# The f2b-postfix-subnet filter reads postfix-sasl ban events from the
# fail2ban log and escalates to subnet-level blocking via ipset-subnet24 action.
[postfix-subnet]
enabled  = true
filter   = f2b-postfix-subnet
logpath  = /var/log/fail2ban.log
findtime = 86400
maxretry = 4
bantime  = 7890000
persistent = true
action   = ipset-subnet24[name=postfix-net]


# =============================================================================
# DOVECOT / IMAP
# =============================================================================

[dovecot]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
findtime  = 10800
bantime   = 7890000
maxretry  = 3
logpath   = /var/log/dovecot.log
            /var/log/mail.log


# =============================================================================
# WEB
# =============================================================================

[apache-auth]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
bantime   = 7890000
port      = http,https
logpath   = %(apache_error_log)s

[apache-badbots]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = http,https
logpath   = %(apache_access_log)s
bantime   = 172800
maxretry  = 1

[apache-noscript]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = http,https
logpath   = %(apache_error_log)s

[apache-overflows]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = http,https
logpath   = %(apache_error_log)s
maxretry  = 2

[apache-nohome]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = http,https
logpath   = %(apache_error_log)s
maxretry  = 2

[apache-botsearch]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = http,https
logpath   = %(apache_error_log)s
maxretry  = 2

[apache-modsecurity]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = http,https
logpath   = %(apache_error_log)s
maxretry  = 2

[apache-shellshock]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = http,https
logpath   = %(apache_error_log)s
maxretry  = 1

[webmin-auth]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
bantime   = 7890000
port      = 1603
logpath   = %(syslog_authpriv)s
backend   = %(syslog_backend)s


# =============================================================================
# INFRASTRUCTURE
# =============================================================================

[snmpd]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
findtime  = 10800
bantime   = 2630000
maxretry  = 3
backend   = systemd
journalmatch = SYSLOG_IDENTIFIER=snmpd

[named-refused-tcp]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = domain,953
protocol  = tcp
filter    = named-refused
logpath   = /var/log/named/security.log

[named-refused-udp]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
port      = domain,953
protocol  = udp
filter    = named-refused
logpath   = /var/log/named/security.log

[mysqld-auth]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
bantime   = 7890000
port      = 3306
logpath   = /var/log/mysql/error.log
backend   = %(mysql_backend)s

[pam-generic]
banaction = iptables-allports[blocktype=DROP]
enabled   = true
bantime   = 7890000
logpath   = %(syslog_authpriv)s
backend   = %(syslog_backend)s

# block-ip: manual single-shot banning via a log file (e.g. from external scripts)
[block-ip]
enabled   = true
filter    = block-ip
action    = iptables-allports[name=block-ip, protocol=all, blocktype=DROP]
logpath   = /var/log/blocked_ips.log
bantime   = 730h
maxretry  = 1

# recidive: re-bans IPs that accumulated bans across multiple jails
[recidive]
enabled   = true
logpath   = /var/log/fail2ban.log
banaction = iptables-allports[blocktype=DROP]
bantime   = 10w
findtime  = 4d

# manual: permanent Cloudflare + iptables block for operator-triggered bans
[manual]
banaction = cloudflare
            iptables-allports[blocktype=DROP]
bantime   = -1
enabled   = true

[php-url-fopen]
enabled = true
port    = http,https
logpath = %(apache_access_log)s
