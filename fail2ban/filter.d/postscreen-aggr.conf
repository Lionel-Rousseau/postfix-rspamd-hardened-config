# =============================================================================
# /etc/fail2ban/filter.d/postscreen-aggr.conf
#
# Catches IPs that triggered Postfix postscreen PREGREET or HANGUP events.
# Used by the [postscreen-aggr] jail in jail.d/custom.conf.
#
# PREGREET: client sent data before the SMTP banner — almost always a bot.
# HANGUP before SMTP handshake: client connected then dropped scanning behaviour.
# =============================================================================

[Definition]

failregex = ^.* postfix/postscreen\[\d+\]: PREGREET \d+ after [0-9.]+ from \[<HOST>\]:\d+: .*$
            ^.* postfix/postscreen\[\d+\]: HANGUP after [0-9.]+ from \[<HOST>\]:\d+ in tests? before SMTP handshake$

ignoreregex =
