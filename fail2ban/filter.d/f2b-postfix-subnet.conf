# =============================================================================
# /etc/fail2ban/filter.d/f2b-postfix-subnet.conf
#
# Reads fail2ban's own log to detect [postfix-sasl] Ban events, then
# captures only the first three octets (x.y.z) as the match group.
# Combined with the ipset-subnet24 action, this escalates individual-IP
# bans from the postfix-sasl jail to full /24 subnet blocks when the same
# subnet generates multiple offenders within findtime.
#
# Example source line:
#   2026-05-12 04:17:31,441 fail2ban.actions [1234]: NOTICE [postfix-sasl] Ban 81.30.107.168
# =============================================================================

[INCLUDES]
before = common.conf

[Definition]

# Capture only the first three octets into <F-ID>; the action appends .0/24.
failregex  = \[postfix-sasl\]\s+Ban\s+<F-ID>\d+\.\d+\.\d+</F-ID>\.\d+
ignoreregex =
