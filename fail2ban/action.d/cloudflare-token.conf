# =============================================================================
# /etc/fail2ban/action.d/cloudflare-token.conf
#
# Adds/removes IPs from Cloudflare firewall access rules via the API.
# Used by the [manual] jail for operator-triggered permanent blocks that
# should propagate to the CDN layer in addition to iptables.
#
# Setup: set cfzone and cftoken in the [DEFAULT] section of jail.local
# (file permissions should be 640, it contains a Bearer token).
# =============================================================================

[Definition]

actionstart =
actionstop  =
actioncheck =

actionban = curl -s -X POST "<_cf_api_url>" \
              <_cf_api_prms> \
              --data '{"mode":"<cfmode>","configuration":{"target":"<cftarget>","value":"<ip>"},"notes":"<notes>"}'

actionunban = id=$(curl -s -X GET "<_cf_api_url>?mode=<cfmode>&notes=<notes>&configuration.target=<cftarget>&configuration.value=<ip>" \
                       <_cf_api_prms> \
                       | awk -F"[,:}]" '{for(i=1;i<=NF;i++){if($i~/'id'\042/){print $(i+1)}}}' \
                       | tr -d ' "' \
                       | head -n 1); \
              if [ -z "$id" ]; then echo "<name>: id for <ip> cannot be found using target <cftarget>"; exit 0; fi; \
              curl -s -X DELETE "<_cf_api_url>/$id" \
                  <_cf_api_prms> \
                  --data '{"cascade": "none"}'

_cf_api_url  = https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules
_cf_api_prms = -H "Authorization: Bearer <cftoken>" -H "Content-Type: application/json"

[Init]
# cfzone  = <YOUR-CLOUDFLARE-ZONE-ID>
# cftoken = <YOUR-CLOUDFLARE-API-TOKEN>   (Zone.Firewall Services permission)
cftarget = ip
cfmode   = block
notes    = Fail2Ban <name>

[Init?family=inet6]
cftarget = ip6
