# =============================================================================
# /etc/fail2ban/action.d/ipset-subnet24.conf
#
# Bans an entire /24 subnet (not just the offending IP) using an ipset of
# type hash:net. Designed for use with the f2b-postfix-subnet filter.
#
# The <F-ID> variable from the filter contains the first three octets (x.y.z);
# this action appends .0/24 to form the CIDR block.
#
# Also calls fail2ban-log-subnet.sh to log the ban for operator audit trail.
# =============================================================================

[Definition]

actionstart =
  ipset create f2b-<name> hash:net family inet timeout 0 -exist
  iptables -C INPUT -m set --match-set f2b-<name> src -j DROP || iptables -I INPUT -m set --match-set f2b-<name> src -j DROP

actionstop =
  iptables -D INPUT -m set --match-set f2b-<name> src -j DROP || true
  ipset destroy f2b-<name> || true

actionban =
  ipset add f2b-<name> <F-ID>.0/24 timeout <bantime> -exist
  /usr/local/bin/fail2ban-log-subnet.sh <F-ID>.0/24 <name>

actionunban = ipset del f2b-<name> <F-ID>.0/24 || true
