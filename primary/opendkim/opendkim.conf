# =============================================================================
# /etc/opendkim.conf - OpenDKIM milter
# DKIM signing (outbound) and verification (inbound) for 12 managed domains.
# Milter socket: inet:8891@localhost (referenced in Postfix main.cf)
#
# Key policy:
#   All domains use RSA 2048-bit keys EXCEPT one domain hosted at a Korean
#   registrar (Café24) that caps DKIM key length at 1024 bits. MinimumKeyBits
#   is therefore set to 1024 to accommodate that domain while rejecting
#   anything weaker.
# =============================================================================

Syslog         yes
SyslogSuccess  yes
LogWhy         yes

AutoRestart      yes
AutoRestartRate  10/1M
Background       yes
DNSTimeout       5
SendReports      yes
SoftwareHeader   yes

# Accept 1024-bit minimum required for the one registrar-limited domain.
# All other domains use 2048-bit keys.
MinimumKeyBits  1024

SignatureAlgorithm  rsa-sha256
Canonicalization    relaxed/relaxed
Mode                sv
OversignHeaders     From

# Per-domain KeyTable and SigningTable, one key per domain, selector "mail".
# One legacy "default" selector entry for example.org is preserved for
# continuity with pre-KeyTable configuration (see KeyTable comments).
KeyTable     refile:/etc/opendkim/KeyTable
SigningTable refile:/etc/opendkim/SigningTable

ExternalIgnoreList  refile:/etc/opendkim/TrustedHosts
InternalHosts       refile:/etc/opendkim/TrustedHosts

UserID  opendkim
UMask   007

# Unix socket accessed by Postfix (chrooted in /var/spool/postfix).
Socket  inet:8891@localhost

PidFile  /run/opendkim/opendkim.pid

# DNSSEC trust anchor : validates DKIM DNS lookups.
TrustAnchorFile  /usr/share/dns/root.key
