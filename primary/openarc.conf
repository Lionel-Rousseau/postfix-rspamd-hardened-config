# =============================================================================
# /etc/openarc/openarc.conf — OpenARC 1.3.0 milter
# Migrated from OpenARC 1.0.0 (2026). Key upgraded to RSA 2048-bit.
#
# Seals outbound mail with an ARC chain so intermediate relays (mailing lists,
# forwarders) can preserve authentication results even after DKIM is broken
# by in-transit modifications.
#
# ARC sealing domain : example.org (shared infrastructure — 13 domains)
# DKIM signing       : per-domain via OpenDKIM milter (port 8891), separate
# Milter socket      : inet:8894@localhost (referenced in Postfix main.cf)
# =============================================================================

# ---- Process ----
PidFile         /run/openarc/openarc.pid
UserID          openarc:openarc
Socket          inet:8894@localhost

# ---- Logging ----
Syslog          yes
SyslogFacility  mail

# ---- Resilience ----
AutoRestart      yes
AutoRestartCount 10
AutoRestartRate  10/1h

# ---- Mode and scope ----
# s = seal   : add ARC headers on outbound mail
# v = verify : validate ARC chain on inbound mail
Mode sv

# ---- Hosts trusted as internal / not subject to ARC verification ----
# Same file for both directives so our own infrastructure is never rejected
# on ARC grounds.
InternalHosts /etc/openarc/internal.hosts
PeerList      /etc/openarc/internal.hosts

# ---- Canonicalisation and algorithm ----
# relaxed/relaxed tolerates minor whitespace changes by MTAs in transit.
Canonicalization   relaxed/relaxed
SignatureAlgorithm rsa-sha256

# ---- ARC sealing key (RSA 2048-bit, rotated 2026) ----
Domain    example.org
Selector  openarc2026
KeyFile   /etc/openarc/keys/example.org/openarc2026.private

# ---- Key hardening (available since OpenARC 1.1.0) ----
# Reject keys shorter than 2048 bits during verification.
MinimumKeySizeRSA 2048
# Refuse to load key files with unsafe permissions (world-readable, etc.).
RequireSafeKeys   yes

# ---- v1.3.0 behaviour ----
# AuthResComments defaults to 'no' in 1.3.0 — Microsoft Mail breaks on
# parenthetical comments in Authentication-Results headers.
# Uncomment only if you need explicit override:
# AuthResComments no

# ---- Optional: signature lifetime ----
# Limits how long an ARC seal is considered valid. Useful if you want seals
# to expire after a defined period. Disabled by default (no expiry).
# SignatureTTL 1209600   # 14 days in seconds
