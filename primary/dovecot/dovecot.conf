# =============================================================================
# /etc/dovecot/dovecot.conf - Dovecot 2.4.2
#
# Dovecot 2.4.x uses a single-file configuration model. The conf.d/ include
# mechanism from 2.3.x is present but commented out; all settings are here.
#
# Roles:
#   - IMAP server (port 993 / implicit TLS — plain IMAP on port 143 disabled)
#   - SASL authentication backend for Postfix (Unix socket)
#   - LMTP delivery endpoint for Postfix (Unix socket)
#   - Sieve engine for server-side filtering and Bayes training pipeline
#
# Anonymised: hostnames and paths use example.org placeholders.
# =============================================================================

dovecot_config_version  = 2.4.2
dovecot_storage_version = 2.4.2

# !include_try conf.d/*.conf


# =============================================================================
# AUTHENTICATION
# =============================================================================

auth_mechanisms = plain login
auth_verbose    = yes
# Debug only — enable temporarily to diagnose authentication failures,
# then comment out again. Logs a SHA1 derivative of the password: never
# plaintext, but any password derivative in logs is a liability if logs
# are compromised. Must not be active in steady-state production.
# auth_verbose_passwords = sha1

auth_cache_size                    = 32M
auth_cache_ttl                     = 1 hour
auth_cache_negative_ttl            = 15 mins
auth_cache_verify_password_with_worker = yes

passdb passwd-file {
  driver           = passwd-file
  passwd_file_path = /etc/dovecot/passwd
}

userdb static {
  driver = static
  fields {
    allow_all_users = yes
    uid  = vmail
    gid  = vmail
    home = /home/vmail/%{user | domain}/%{user | username}/
  }
}


# =============================================================================
# MAIL STORAGE
# =============================================================================

first_valid_uid = 1000
log_path        = /var/log/dovecot.log

mail_driver          = maildir
mail_home            = /home/vmail/%{user | domain}/%{user | username}/home
mail_path            = /home/vmail/%{user | domain}/%{user | username}
mail_privileged_group = vmail

mbox {
  write_locks = fcntl
}


# =============================================================================
# PROTOCOLS
# =============================================================================

protocols = imap lmtp


# =============================================================================
# TLS / SSL
# =============================================================================

ssl         = required
ssl_min_protocol = TLSv1.2
# X25519 preferred for performance; secp384r1 for high-security clients.
ssl_curve_list = X25519:prime256v1:secp384r1
# Disable TLS session tickets — avoids long-term ticket key exposure risk.
ssl_options = no_ticket

ssl_server {
  cert_file = /etc/letsencrypt/live/web-mail.example.org/fullchain.pem
  key_file  = /etc/letsencrypt/live/web-mail.example.org/privkey.pem
  # Shared DH parameter file with Postfix — FFDHE 4096-bit (RFC 7919).
  dh_file   = /etc/postfix/ffdhe4096.pem
}

ssl_client {
  ca_dir = /etc/ssl/certs
}

local_name web-mail.example.org {
  ssl_server {
    cert_file = /etc/letsencrypt/live/web-mail.example.org/fullchain.pem
    key_file  = /etc/letsencrypt/live/web-mail.example.org/privkey.pem
  }
}


# =============================================================================
# SERVICES
# =============================================================================

service auth {
  vsz_limit = 2G

  # SASL socket for Postfix (postfix user must be in opendkim group or vice versa)
  unix_listener /var/spool/postfix/private/auth {
    user  = postfix
    group = postfix
    mode  = 0660
  }

  unix_listener auth-userdb {
    user  = vmail
    group = vmail
    mode  = 0600
  }
}

service imap-login {
  process_min_avail  = 4
  restart_request_count = unlimited
  vsz_limit          = 2G

  # Plain IMAP (port 143) explicitly disabled — IMAPS only.
  inet_listener imap {
    port = 0
  }

  inet_listener imaps {
    port = 993
    ssl  = yes
  }
}

service lmtp {
  unix_listener lmtp {
  }

  # LMTP socket for Postfix virtual delivery
  # (virtual_transport = lmtp:unix:private/dovecot-lmtp in main.cf)
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    user  = postfix
    group = postfix
    mode  = 0600
  }
}

service stats {
  # stats-writer mode 0666 is intentional: Dovecot 2.4 internal processes
  # (imap, lmtp, auth) run under different system users and all need write
  # access to this socket to report metrics. Restricting to 0660 with a
  # shared group requires all spawned processes to share that group, which
  # is not guaranteed across Dovecot service boundaries in this setup.
  # Ref: https://doc.dovecot.org/configuration_manual/stats/
  unix_listener stats-writer {
    mode = 0666
  }
}


# =============================================================================
# IMAP PROTOCOL
# =============================================================================

protocol imap {
  mail_max_userip_connections = 100
  mail_plugins = imap_sieve
}


# =============================================================================
# LMTP PROTOCOL
# =============================================================================

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}


# =============================================================================
# SIEVE — server-side filtering and Bayes training pipeline
#
# IMAPSieve integration: moving messages to/from the Junk folder
# automatically triggers Rspamd Bayes training (spam or ham) via
# external pipe scripts in /etc/dovecot/sieve/.
# =============================================================================

sieve_plugins {
  sieve_imapsieve  = yes
  sieve_extprograms = yes
}

sieve_global_extensions {
  vnd.dovecot.pipe = yes
}

sieve_pipe_bin_dir = /etc/dovecot/sieve

# Per-user Sieve script (server-side rules)
sieve_script personal {
  driver      = file
  path        = ~/sieve
  active_path = ~/.dovecot.sieve
}

# Global pre-filter (applied before user scripts)
sieve_script rspamd-before {
  type = before
  path = /etc/dovecot/rspamd.sieve
}

# Global post-filter (applied after user scripts)
sieve_script global-after {
  type = after
  path = /etc/dovecot/sieve-after/
}

# Moving a message OUT of Junk → report as ham to Rspamd Bayes
imapsieve_from Junk {
  sieve_script report-ham {
    cause = copy
    type  = before
    path  = /etc/dovecot/sieve/report-ham.sieve
  }
}


# =============================================================================
# NAMESPACE / IMAP FOLDERS
# =============================================================================

namespace inbox {
  inbox = yes

  mailbox Drafts {
    auto         = subscribe
    special_use  = "\\Drafts"
  }

  mailbox Junk {
    auto        = subscribe
    special_use = "\\Junk"

    # Moving a message INTO Junk → report as spam to Rspamd Bayes
    sieve_script report-spam {
      cause  = copy
      driver = file
      type   = before
      path   = /etc/dovecot/sieve/report-spam.sieve
    }
  }

  mailbox Trash {
    auto        = subscribe
    special_use = "\\Trash"
  }

  mailbox Sent {
    auto        = subscribe
    special_use = "\\Sent"
  }

  mailbox "Sent Messages" {
    special_use = "\\Sent"
  }
}
