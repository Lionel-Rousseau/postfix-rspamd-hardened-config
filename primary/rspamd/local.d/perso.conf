# local.d/perso.conf
# ---------------------------------------------------------------------------
# Custom Rspamd settings module entries — site-specific overrides on top of
# the default settings.conf. This is where we declare exceptions for traffic
# patterns we know are safe but that the default scoring would penalise.
# ---------------------------------------------------------------------------

# logwatch_local: Logwatch reports come from cron@root with a generated
# Subject and an Auto-Submitted header. They have no business hitting the
# network-based RBL group, the Bayes classifier, or URL/forgery checks —
# the report content itself contains symbol names and IPs that look like
# spam to a naive classifier. We disable those groups for this exact
# pattern only, and we add a strongly-negative LOGWATCH_LOCAL_OK symbol
# so we can tell from the headers that this exemption applied.
logwatch_local {
  priority = 1000;

  from_mime = "root@example.org";
  ip = "127.0.0.1";

  header = {
    "Subject" = "(?i)^logwatch for ";
    "Auto-Submitted" = "^auto-generated$";
  }

  apply {
    groups_disabled = ["rbl"];

    symbols_disabled = [
      "URL_EXCESSIVE_DOTS",
      "BAYES_SPAM",
      "FORGED_RECIPIENTS",
      "URIBL_GREY",
      "DBL_SPAM",
      "ABUSE_SURBL"
    ];

    actions {
      reject = 100.0;
      "rewrite subject" = 100.0;
      "add header" = 100.0;
    }

    LOGWATCH_LOCAL_OK = -20.0;
  }

  symbols = ["LOGWATCH_LOCAL_OK"];
}

