# =============================================================================
# /etc/rspamd/local.d/perso.conf — site-specific Rspamd overrides
#
# Declares exceptions for traffic patterns that are known-safe but that the
# default scoring would penalise. Each pattern is narrowly targeted;
# none of these entries create a blanket whitelist.
# =============================================================================

# ---------------------------------------------------------------------------
# logwatch_local: Logwatch cron reports from root@ via localhost.
#
# Logwatch subjects and bodies contain IP addresses, hostnames, symbol names,
# and URL patterns that trigger RBL, Bayes, and URIBL checks. The report is
# sent only from 127.0.0.1 and carries a distinctive Subject prefix — narrow
# enough to target safely. A negative custom symbol is added so the exemption
# is auditable in the X-Spamd-Result header.
# ---------------------------------------------------------------------------
logwatch_local {
  priority = 1000;

  from_mime = "root@example.org";
  ip = "127.0.0.1";

  header = {
    "Subject"        = "(?i)^logwatch for ";
    "Auto-Submitted" = "^auto-generated$";
  }

  apply {
    groups_disabled = ["rbl"];

    symbols_disabled = [
      "URL_EXCESSIVE_DOTS",
      "BAYES_SPAM",
      "FORGED_RECIPIENTS",
      "URIBL_GREY",
      "DBL_SPAM",
      "ABUSE_SURBL"
    ];

    actions {
      reject            = 100.0;
      "rewrite subject" = 100.0;
      "add header"      = 100.0;
    }

    LOGWATCH_LOCAL_OK = -20.0;
  }

  symbols = ["LOGWATCH_LOCAL_OK"];
}

