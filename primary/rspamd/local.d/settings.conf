# =============================================================================
# /etc/rspamd/local.d/settings.conf - per-pattern settings overrides
#
# Complements perso.conf. Where perso.conf handles logwatch specifically
# (hard threshold override), this file handles the broader class of local
# system notifications from root@ on both MX hosts, lifting only the soft
# actions (rewrite subject, add header) without disabling RBL groups.
#
# Two separate patterns cover primary and secondary MX respectively
# both generate cron and monitoring mail that passes through the primary
# milter chain before local delivery.
# =============================================================================

# Spamhaus DQS settings key (retired, preserved for reference if restoring).
# Activate by uncommenting and replacing <SPAMHAUS-DQS-KEY>.
### spamhaus {
###     dqs = "<SPAMHAUS-DQS-KEY>"
###     max_urls = 100
###     max_cws = 100
### }

# ---------------------------------------------------------------------------
# local_root_notifications: system mail from the primary MX (root@).
# Covers cron jobs, monitoring alerts, logcheck, etc. sent via localhost.
# ---------------------------------------------------------------------------
local_root_notifications {
  priority = 100;

  from_mime = "root@example.org";
  ip = "127.0.0.1";

  apply {
    groups_disabled = ["rbl"];

    symbols_disabled = [
      "URL_EXCESSIVE_DOTS",
      "BAYES_SPAM",
      "FORGED_RECIPIENTS",
      "URIBL_GREY",
      "DBL_SPAM",
      "ABUSE_SURBL",
      "R_MISSING_CHARSET"
    ];

    actions {
      "rewrite subject" = null;
      "add header"      = null;
    }

    LOCAL_ROOT_NOTIFICATION_OK = -20.0;
  }

  symbols = ["LOCAL_ROOT_NOTIFICATION_OK"];
}

# ---------------------------------------------------------------------------
# secondary_root_notifications: system mail from the secondary MX (root@).
# The secondary MX relays its own cron/monitoring output through the primary
# for delivery; same scoring exceptions apply.
# ---------------------------------------------------------------------------
secondary_root_notifications {
  priority = 100;

  from_mime = "root@mx-secondary.example.org";
  ip = "127.0.0.1";

  apply {
    groups_disabled = ["rbl"];

    symbols_disabled = [
      "URL_EXCESSIVE_DOTS",
      "BAYES_SPAM",
      "FORGED_RECIPIENTS",
      "URIBL_GREY",
      "DBL_SPAM",
      "ABUSE_SURBL",
      "R_MISSING_CHARSET"
    ];

    actions {
      "rewrite subject" = null;
      "add header"      = null;
    }

    SECONDARY_ROOT_NOTIFICATION_OK = -20.0;
  }

  symbols = ["SECONDARY_ROOT_NOTIFICATION_OK"];
}
