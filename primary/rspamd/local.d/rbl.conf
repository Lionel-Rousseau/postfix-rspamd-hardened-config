# =============================================================================
# /etc/rspamd/local.d/rbl.conf — RBL provider definitions
#
# Active provider: Abusix Mail Intelligence (since 2023).
# Previous provider: Spamhaus DQS — configuration preserved below in comments
# as migration reference. Spamhaus DQS was retired from this installation due
# to a false-positive on a known partner domain and disproportionate cost for
# ~170 msg/day traffic volume. See docs/hardening-decisions.md.
#
# Abusix zones require a per-account API key. Replace <ABUSIX-API-KEY> with
# the key from your Abusix customer portal (https://app.abusix.com).
# The same key is used in postfix/main.cf (postscreen_dnsbl_sites,
# reject_rhsbl_*) and postfix/master.cf (authbl on submission ports).
# =============================================================================

#url_whitelist = [
#  "$LOCAL_CONFDIR/local.d/maps.d/surbl-whitelist.inc.local",
#  "${DBDIR}/surbl-whitelist.inc.local",
#  "fallback+file://${CONFDIR}/maps.d/surbl-whitelist.inc"
#];

rbls {
  abusix_noip {
    symbol = "RBL_AMI_NOIP";
    rbl = "<ABUSIX-API-KEY>.noip.mail.abusix.zone";
    checks = [ "from", "received" ];
  }

  abusix_dblack {
    symbol = "RBL_AMI_DBLACK";
    rbl = "<ABUSIX-API-KEY>.dblack.mail.abusix.zone";
    checks = [ "content_urls", "dkim" ];
    selector = "urls:get_host";
  }

  abusix_nod {
    symbol = "RBL_AMI_NOD";
    rbl = "<ABUSIX-API-KEY>.nod.mail.abusix.zone";
    checks = [ "content_urls", "dkim", "urls" ];
  }

  SURBL_MULTI {
    ignore_defaults = true;
    rbl = "multi.surbl.org";
    checks = ["emails", "dkim", "urls"];
    emails_domainonly = true;
    urls = true;
    returnbits {
      ABUSE_SURBL = 64;
      MW_SURBL_MULTI = 16;    # malware
      PH_SURBL_MULTI = 8;     # phishing
      DM_SURBL = 4;           # domain blacklist
    }
  }

  URIBL_MULTI {
    ignore_defaults = true;
    rbl = "multi.uribl.com";
    checks = ["emails", "dkim", "urls"];
    emails_domainonly = true;
    returnbits {
      URIBL_BLACK = 2;
      URIBL_GREY  = 4;
      URIBL_RED   = 8;
    }
  }

  RSPAMD_URIBL {
    ignore_defaults = true;
    rbl = "uribl.rspamd.com";
    checks = ["emails", "dkim", "urls"];
    images = true;
    emails_domainonly = true;
    hash = "blake2";
    hash_len = 32;
    hash_format = "base32";
    returncodes {
      RSPAMD_URIBL = ["127.0.0.2"];
    }
  }
}

