# =============================================================================
# /etc/rspamd/local.d/milter_headers.conf - milter header policy
#
# Controls which X-Spam-* / Authentication-Results headers Rspamd adds to
# messages. skip_local and skip_authenticated are both set to false so that
# outbound submission mail also carries authentication results headers,
# useful for debugging DKIM/DMARC alignment on sent mail.
# =============================================================================

use = ["x-spamd-bar", "x-spam-level", "x-spam-status", "my-x-spam-score",
       "x-virus", "authentication-results"];

extended_spam_headers  = true;
authenticated_headers  = ["authentication-results"];
skip_local             = false;
skip_authenticated     = false;

custom {
  # Adds a clean numeric X-Spam-Score header (two decimal places).
  # The built-in x-spam-status embeds the score inside a longer string;
  # this separate header makes score-based filtering rules in MUAs simpler.
  my-x-spam-score = <<EOD
    return function(task, common_meta)
      local sc = common_meta['metric_score'] or task:get_metric_score()
      return nil,
        { ['X-Spam-Score'] = string.format('%.2f', sc[1]) },
        { ['X-Spam-Score'] = 1 },
        {}
    end
EOD;
}

routines {
  x-virus {
    header  = "X-Virus";
    remove  = 1;
    symbols = ["CLAM_VIRUS", "JUST_EICAR"];
  }

  authentication-results {
    header = "Authentication-Results";
    remove = 1;
    spf_symbols {
      pass      = "R_SPF_ALLOW";
      fail      = "R_SPF_FAIL";
      softfail  = "R_SPF_SOFTFAIL";
      neutral   = "R_SPF_NEUTRAL";
      temperror = "R_SPF_DNSFAIL";
      none      = "R_SPF_NA";
      permerror = "R_SPF_PERMFAIL";
    }
    dkim_symbols {
      pass      = "R_DKIM_ALLOW";
      fail      = "R_DKIM_REJECT";
      temperror = "R_DKIM_TEMPFAIL";
      none      = "R_DKIM_NA";
      permerror = "R_DKIM_PERMFAIL";
    }
    dmarc_symbols {
      pass       = "DMARC_POLICY_ALLOW";
      permerror  = "DMARC_BAD_POLICY";
      temperror  = "DMARC_DNSFAIL";
      none       = "DMARC_NA";
      reject     = "DMARC_POLICY_REJECT";
      softfail   = "DMARC_POLICY_SOFTFAIL";
      quarantine = "DMARC_POLICY_QUARANTINE";
    }
  }
}
