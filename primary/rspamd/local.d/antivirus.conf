# =============================================================================
# /etc/rspamd/local.d/antivirus.conf - ClamAV integration
#
# ClamAV is accessed via its Unix socket (clamd). The CLAM_VIRUS symbol is
# raised on detection; the actual reject action is delegated to force_actions.conf
# to allow per-pattern action overrides without modifying this file.
# =============================================================================

clamav {
  message = '***${SCANNER}: virus found: "${VIRUS}"***';
  subject = '***${SCANNER}: virus found: "${VIRUS}"***';

  scan_mime_parts  = true;
  scan_text_mime   = true;
  scan_image_mime  = true;
  timeout          = 10;
  retransmits      = 2;
  log_clean        = true;

  symbol  = "CLAM_VIRUS";
  type    = "clamav";
  servers = "/var/run/clamav/clamd.ctl";

  # EICAR test signature gets a distinct symbol so it can be handled
  # differently from real detections in force_actions.conf.
  patterns {
    JUST_EICAR = '^Eicar-Test-Signature$';
  }
}
