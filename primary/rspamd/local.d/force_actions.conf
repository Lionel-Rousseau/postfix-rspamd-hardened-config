# =============================================================================
# /etc/rspamd/local.d/force_actions.conf — forced action rules
#
# Antivirus rejection is handled here (not in antivirus.conf) so that
# action logic is centralised and can be adjusted without touching the
# scanner configuration.
# =============================================================================

rules {
  # Hard reject on real virus detection. Custom message shown to the sender.
  CLAM_VIRUS_REJECT_WITH_MESSAGE {
    action     = "reject";
    expression = "CLAM_VIRUS";
    message    = "*** VIRUS FOUND ***";
    subject    = "*** VIRUS FOUND *** %s";
  }

  # Rewrite subject for EICAR test signature — softer action to confirm
  # scanning is operational without bouncing test messages.
  JUST_EICAR_REJECT_WITH_MESSAGE {
    action     = "rewrite subject";
    expression = "JUST_EICAR";
    message    = "*** EICAR TEST VIRUS FOUND ***";
    subject    = "*** EICAR TEST VIRUS FOUND *** %s";
  }
}
