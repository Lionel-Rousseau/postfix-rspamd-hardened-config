# =============================================================================
# /etc/postfix/tls_config.conf - OpenSSL TLS policy for Postfix
# Referenced by: main.cf  →  tls_config_file = /etc/postfix/tls_config.conf
#                             tls_config_name = postfix
#
# Uses the OpenSSL system-default configuration format (available since
# OpenSSL 1.1.1 / Ubuntu 20.04+). Restricts accepted signature algorithms
# for both inbound and outbound TLS, complementing the cipher suite
# exclusions defined in main.cf.
# =============================================================================

postfix = postfix_settings

[postfix_settings]
ssl_conf = postfix_ssl_settings

[postfix_ssl_settings]
system_default = postfix_tls_defaults

[postfix_tls_defaults]
# Signature algorithms accepted during TLS handshake, ordered by preference.
# ECDSA variants first (smaller keys, faster handshakes), then RSA-PSS
# (modern PKCS#1 v2.1 padding), then classical RSA.
# SHA-1 and MD5 are intentionally absent.
SignatureAlgorithms = ECDSA+SHA512:ECDSA+SHA384:ECDSA+SHA256:rsa_pss_rsae_sha512:rsa_pss_rsae_sha384:rsa_pss_rsae_sha256:RSA+SHA512:RSA+SHA384:RSA+SHA256
